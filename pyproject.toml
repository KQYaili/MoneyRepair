[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moneyrepair"
version = "4.3.3"
description = "Simulation toolkit for banknote fragment compatibility search."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["computer-vision", "fragments", "reconstruction", "simulation", "search"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=1.24",
    "pillow>=10.0",
    "numba>=0.59",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
]
ml = [
    "torch>=2.0",
    "torchvision>=0.15",
]
ocr = [
    "pytesseract>=0.3.10",
]
reports = [
    "matplotlib>=3.8",
]
llm = []

[project.urls]
Homepage = "https://github.com/KQYaili/MoneyRepair"
Documentation = "https://github.com/KQYaili/MoneyRepair/blob/main/docs/pipeline.md"
Issues = "https://github.com/KQYaili/MoneyRepair/issues"

[project.scripts]
moneyrepair = "moneyrepair.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "experimental: mark test as part of experimental unverified research tools",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Start from Ruff's default rule set (pycodestyle errors E4/E7/E9 + Pyflakes F).
# This is the minimal lint gate; tighten gradually as the codebase is cleaned up.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Test modules set pytestmark / call pytest.importorskip before their imports,
# so module-level imports legitimately appear after code (E402).
"tests/**" = ["E402"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
# Advisory type checking: start lenient and tighten over time. The experimental
# research modules use dynamic torch constructs and are excluded for now; CI runs
# mypy as a non-blocking step until the type surface is cleaned up.
exclude = ["src/moneyrepair/experimental/"]
